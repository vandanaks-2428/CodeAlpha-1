<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Project</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #1f2937;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .back-btn {
            background: white;
            color: #1f2937;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #e5e7eb;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #1f2937;
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* Form */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
        }

        .create-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #16a34a;
        }

        /* Mobile */
        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            header h1 {
                font-size: 20px;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Project Manager</h1>

        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            ← Back to Dashboard
        </button>
    </header>

    <main class="container">

        <div class="form-card">

            <h2>Create New Project</h2>

            <form id="projectForm">

                <label for="projectName">Project Name</label>
                <input type="text" id="projectName" required>

                <label for="projectDescription">Project Description</label>
                <textarea id="projectDescription" rows="5" required></textarea>

                <button type="submit" class="create-btn">
                    Create Project
                </button>

            </form>

            <p id="message"></p>

        </div>

    </main>

    <script>
        document.getElementById("projectForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const name = document.getElementById("projectName").value;
            const description = document.getElementById("projectDescription").value;

            const response = await fetch("https://codealpha-1-gqxy.onrender.com/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    description: description,
                    created_by: 1
                })
            });

            const data = await response.json();

            document.getElementById("message").textContent = data.message;
        });
    </script>

</body>
</html>
