<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Project Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Project Manager</h1>
    <button onclick="logout()">
    Logout
</button>

    <h2 id="welcomeMessage">Welcome to your Project Management Dashboard!</h2>

    <button onclick="window.location.href='create-project.html'">
    + Create Project
</button>

    <h3>My Projects</h3>

    <div id="projectsList">
    <p>Loading projects...</p>
</div>

<script>

    function checkLogin() {
    const userId = localStorage.getItem("user_id");

    if (!userId) {
        window.location.replace("login.html");
    }
}

checkLogin();

window.addEventListener("pageshow", function () {
    checkLogin();
});


    const username = localStorage.getItem("username");

if (username) {
    document.getElementById("welcomeMessage").textContent =
        "Welcome, " + username + "!";
}
    async function loadProjects() {

        const response = await fetch("http://127.0.0.1:5000/projects");

        const projects = await response.json();

        const projectsList = document.getElementById("projectsList");

        projectsList.innerHTML = "";

        if (projects.length === 0) {
            projectsList.innerHTML = "<p>No projects created yet.</p>";
            return;
        }

        projects.forEach(function(project) {

            const projectDiv = document.createElement("div");

            projectDiv.innerHTML = `
    <h3>${project.name}</h3>
    <p>${project.description}</p>
    <button onclick="window.location.href='project.html?id=${project.id}'">
        View Project
    </button>
    <hr>
`;

            projectsList.appendChild(projectDiv);
        });
    }

    loadProjects();
    function logout() {
    localStorage.removeItem("username");
    localStorage.removeItem("user_id");

    window.location.href = "login.html";
}
</script>
</body>
</html>
