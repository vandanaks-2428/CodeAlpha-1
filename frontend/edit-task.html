<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task - Project Manager</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* Header */
        header {
            background: #1f2937;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 25px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .back-btn,
        .logout-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn {
            background: white;
            color: #1f2937;
        }

        .back-btn:hover {
            background: #e5e7eb;
        }

        .logout-btn {
            background: #dc2626;
            color: white;
        }

        .logout-btn:hover {
            background: #b91c1c;
        }

        /* Main container */
        .container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h2 {
            color: #1f2937;
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* Form */
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
        }

        .update-btn {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .update-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #16a34a;
        }

        /* Mobile */
        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            header h1 {
                font-size: 20px;
            }

            .header-buttons {
                justify-content: space-between;
            }

            .container {
                width: 94%;
                margin: 30px auto;
            }

            .form-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Project Manager</h1>

        <div class="header-buttons">

            <button class="back-btn" onclick="history.back()">
                ← Back to Project
            </button>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>
    </header>

    <main class="container">

        <div class="form-card">

            <h2>Edit Task</h2>

            <form id="editTaskForm">

                <label for="taskTitle">Task Title</label>
                <input type="text" id="taskTitle" required>

                <label for="taskDescription">Task Description</label>
                <textarea id="taskDescription" rows="5" required></textarea>

                <button type="submit" class="update-btn">
                    Update Task
                </button>

            </form>

            <p id="message"></p>

        </div>

    </main>

    <script>

        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get("id");

        async function loadTask() {

            try {

                const response = await fetch(
                    "http://127.0.0.1:5000/tasks/" + taskId
                );

                const task = await response.json();

                document.getElementById("taskTitle").value = task.title;
                document.getElementById("taskDescription").value = task.description;

            } catch (error) {

                console.error("Error loading task:", error);

            }
        }


        document.getElementById("editTaskForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const title = document.getElementById("taskTitle").value;
            const description = document.getElementById("taskDescription").value;

            const response = await fetch(
                "http://127.0.0.1:5000/tasks/" + taskId + "/edit",
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        title: title,
                        description: description
                    })
                }
            );

            const data = await response.json();

            document.getElementById("message").textContent = data.message;

        });


        function logout() {

            localStorage.removeItem("username");
            localStorage.removeItem("user_id");

            window.location.href = "login.html";

        }


        loadTask();

    </script>

</body>
</html>
